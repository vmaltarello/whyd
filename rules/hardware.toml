# Disks, temperature.

[[rule]]
id      = "disk.ext4-error"
level   = "err"
source  = "kernel"
text    = "EXT4-fs error (device {device})"
title   = "ext4 error on {device}"
explain = """
The ext4 filesystem found an inconsistency. Check the filesystem with fsck while it is not
mounted, and the disk's health with `smartctl -a`.
"""
match   = ["EXT4-fs error (device nvme0n1p2): ext4_lookup:1855: inode #2: comm ls: deleted inode referenced: 1234"]

[[rule]]
id      = "disk.btrfs-error"
level   = "err"
source  = "kernel"
text    = [
  "BTRFS error (device {device})",
  "BTRFS critical (device {device})",
]
title   = "btrfs error on {device}"
explain = """
btrfs reported an error. Checksum errors mean the data read back is not what was written,
which can come from the disk or from memory; `btrfs device stats` and `btrfs scrub` tell you
more.
"""
match   = ["BTRFS error (device nvme0n1p2): bdev /dev/nvme0n1p2 errs: wr 0, rd 0, flush 0, corrupt 1, gen 0"]

[[rule]]
id           = "disk.io-error"
level        = "err"
source       = "kernel"
text         = "I/O error, dev {device}, sector"
title        = "I/O error on {device}"
merge_window = "10m"
explain      = """
Reading or writing the disk failed. Check its health with `smartctl -a` and its cable or
slot; if it is the system disk, back up first.
"""
match        = ["I/O error, dev sda, sector 123456 op 0x0:(READ) flags 0x80700 phys_seg 1 prio class 2"]

[[rule]]
id      = "disk.nvme-timeout"
level   = "err"
source  = "kernel"
text    = "nvme {device}: I/O {_}timeout"
title   = "NVMe {device} timeout, controller reset"
explain = """
The NVMe drive did not answer a command in time and the kernel reset the controller.
Repeated timeouts point to the drive, its power management or its connection.
"""
match   = ["nvme nvme0: I/O 123 QID 4 timeout, reset controller"]

[[rule]]
id      = "thermal.critical"
level   = "err"
source  = "kernel"
text    = [
  "critical temperature reached",
  "Critical temperature reached",
  "thermal{_}shutting down",
  "Thermal{_}shutting down",
]
title   = "critical temperature, emergency shutdown"
explain = """
A sensor reached its critical temperature and the kernel powered the machine off to protect
it. Look at what was running at full load and at how the machine is cooled.
"""
match   = ["thermal thermal_zone0: critical temperature reached (105 C), shutting down"]

[[rule]]
id      = "disk.fat-dirty"
level   = "info"
source  = "kernel"
text    = "FAT-fs ({device}): Volume was not properly unmounted"
title   = "{device} not unmounted cleanly (FAT)"
note    = "usually the EFI partition; the mark stays until fsck.fat clears it"
explain = """
A FAT filesystem (usually the EFI system partition) was found marked as in use, because at some
point the system stopped without unmounting it. The mark stays, and is reported at every boot,
until fsck.fat run on the unmounted partition clears it and checks for damage. On its own it
doesn't explain a crash.
"""
match   = ["FAT-fs (nvme0n1p1): Volume was not properly unmounted. Some data may be corrupt. Please run fsck."]
