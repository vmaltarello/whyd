# Context for the timeline: not problems, but they explain the story around them.

# The system went to sleep. If the journal ends while it is suspended, the machine never woke
# up, for example because the battery ran out.
[[rule]]
id     = "power.suspend"
level  = "context"
source = "kernel"
text   = "PM: suspend entry"
match  = ["PM: suspend entry (deep)"]

# The system woke up from sleep.
[[rule]]
id     = "power.resume"
level  = "context"
source = "kernel"
text   = "PM: suspend exit"
match  = ["PM: suspend exit"]

# The system saved its memory to disk and powered off. If the journal ends here, the saved state
# was never restored.
[[rule]]
id     = "power.hibernate"
level  = "context"
source = "kernel"
text   = "PM: hibernation: hibernation entry"
match  = ["PM: hibernation: hibernation entry"]

# The system was restored from hibernation.
[[rule]]
id     = "power.thaw"
level  = "context"
source = "kernel"
# Known noisy driver warnings: shown once, counted, explained.
text   = "PM: hibernation: hibernation exit"
match  = ["PM: hibernation: hibernation exit"]

[[rule]]
id      = "known.rtw88-tx"
level   = "info"
source  = "kernel"
text    = [
  "{driver} {_}: failed to write TX skb to HCI",
  "{driver} {_}: failed to get tx report from firmware",
]
title   = "{driver} TX errors, known issue"
note    = "common with this driver; matters if Wi-Fi drops at the same time"
explain = """
The rtw88 Wi-Fi driver could not hand a packet to the chip. Bursts of this message are
common with this driver and the connection usually recovers; it matters if Wi-Fi drops at
the same times.
"""
match   = [
  "rtw88_8822ce 0000:01:00.0: failed to write TX skb to HCI",
  "rtw88_8822ce 0000:01:00.0: failed to get tx report from firmware",
]

[[rule]]
id      = "known.portal-gtk"
level   = "info"
source  = "systemd"
text    = "xdg-desktop-portal-gtk.service: Failed with result"
title   = "portal-gtk failed at login, harmless"
note    = "started again when an application needs it"
explain = """
xdg-desktop-portal-gtk exited with an error during login. Portals are started on demand
through D-Bus, so it is started again when an application needs it.
"""
match   = ["xdg-desktop-portal-gtk.service: Failed with result 'exit-code'."]

[[rule]]
id      = "known.rtw88-dpk"
level   = "info"
source  = "kernel"
text    = "{driver} {_}: failed to do dpk calibration"
title   = "{driver} calibration failed (known issue)"
note    = "a Wi-Fi power calibration step; the driver goes on without it"
explain = """
The rtw88 driver could not complete a calibration step of the Wi-Fi transmitter and continues
without it.
"""
match   = ["rtw88_8822ce 0000:01:00.0: failed to do dpk calibration"]
