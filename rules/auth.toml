# Logins, sudo and polkit.

[[rule]]
id       = "auth.failed"
level    = "warn"
priority = "warning"
text     = "pam_unix({service}:{_}): auth could not identify password for [{user}]"
title    = "{service}: authentication failed"
note     = "a wrong or cancelled password; check the user name too"
explain  = """
A password was asked and not accepted, or the prompt was cancelled. Repeated failures for a
user you don't know can mean someone tried to log in; for your own user it is usually a typo
or a cancelled prompt.
"""
match    = [
  "pam_unix(sudo:auth): auth could not identify password for [user]",
  "pam_unix(greetd:auth): auth could not identify password for [alex]",
]

[[rule]]
id      = "auth.wrong-password"
level   = "warn"
source  = "sudo"
text    = "{n:num} incorrect password attempt"
title   = "sudo: {n} incorrect password attempts"
explain = """
sudo was given a wrong password, as many times as the message says.
"""
match   = ["user : 3 incorrect password attempts ; TTY=pts/1 ; PWD=/home/user ; USER=root ; COMMAND=/usr/bin/pacman"]

[[rule]]
id      = "auth.no-password"
level   = "info"
source  = "sudo"
text    = "a password is required"
title   = "sudo refused: a password is required"
note    = "a script or tool ran sudo without a terminal to ask the password"
explain = """
A command was run with sudo where no password could be asked (for example sudo -n, or from a
script without a terminal), so sudo refused it.
"""
match   = ["user : a password is required ; PWD=/home/user ; USER=root ; COMMAND=/usr/bin/true"]

# The PAM conversation lines that come with a failed or cancelled prompt.
[[rule]]
id    = "auth.conversation"
level = "context"
text  = [
  "pam_{_}({_}): conversation failed",
  "pam_{_}({_}): Error sending audit message",
]
match = ["pam_unix(sudo:auth): conversation failed"]
