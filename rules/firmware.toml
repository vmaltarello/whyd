# Firmware and early hardware setup: present at every boot on many machines, grouped so they
# stay visible without filling the problems list.

[[rule]]
id          = "firmware.boot"
level       = "info"
source      = "kernel"
text        = [
  "ACPI Error",
  "ACPI Warning",
  "ACPI BIOS Error",
  "ACPI BIOS Warning",
  "_CPC object is not present",
  "TSC found unstable",
  "Marking clocksource {_} unstable",
  "clocksource: Watchdog ",
  "clocksource: Clocksource ",
  "TDX not supported",
  "SMBus Timeout",
  "i2c {_}: Failed",
  "psp gfx command {_} failed",
  "missing or invalid SUBNQN",
  "AUX port disabled",
  "WQ_NAME_LEN",
]
title       = "firmware or hardware setup message"
note        = "often repeated at every boot; compare with older sessions"
merge_title = "firmware and hardware setup messages"
explain     = """
Messages from the BIOS and ACPI tables, or from drivers while they set up the hardware. whyd
groups them because they tend to repeat at every boot; compare with older sessions to see
whether they are new.
"""
match       = [
  'ACPI BIOS Error (bug): Could not resolve symbol [\_SB.PCI0.GPP4.WLAN], AE_NOT_FOUND (20260408/dswload2-162)',
  "amd_pstate: the _CPC object is not present in SBIOS or ACPI disabled",
  "i2c i2c-7: SMBus Timeout!",
  "clocksource: Marking clocksource tsc-early unstable due to frequency skew",
]
nomatch     = ["clocksource: Switched to clocksource hpet"]

[[rule]]
id          = "firmware.tpm"
level       = "info"
priority    = "warning"
text        = "NvPCR"
title       = "TPM NvPCR not available"
note        = "a systemd TPM feature this machine doesn't support"
merge_title = "TPM NvPCR not available"
explain     = """
systemd tried to record measurements in a TPM non-volatile register (NvPCR) and the TPM or
its firmware doesn't provide it.
"""
match       = [
  "Could not extend NvPCR: No such file or directory",
  "Failed to initialize NvPCR index: No such file or directory",
]

[[rule]]
id      = "firmware.regdb"
level   = "info"
source  = "kernel"
text    = "Direct firmware load for regulatory.db failed"
title   = "Wi-Fi regulatory database missing"
note    = "install wireless-regdb"
explain = """
The kernel could not find the database of the Wi-Fi channels and power allowed in each
country, so it keeps to the most restrictive settings: some channels may be missing and the
signal weaker. The database comes in the wireless-regdb package.
"""
match   = ["faux_driver regulatory: Direct firmware load for regulatory.db failed with error -2"]
