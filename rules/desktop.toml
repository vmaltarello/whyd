# Network and audio on the desktop.

[[rule]]
id      = "network.wifi-failed"
level   = "warn"
source  = "NetworkManager"
text    = [
  "device ({device}): Activation: failed for connection",
  "device ({device}): Activation: (wifi) Network.Connect failed",
]
title   = "{device}: Wi-Fi connection failed"
explain = """
NetworkManager could not connect to the wireless network. The lines just before it in the
journal say which step failed: authentication, association or getting an address.
"""
match   = [
  "<warn>  [1790349818.1852] device (wlp1s0): Activation: failed for connection 'HomeNet-5G'",
  "<error> [1790349818.1852] device (wlan0): Activation: (wifi) Network.Connect failed: GDBus.Error:net.connman.iwd.Failed: Operation failed",
]

[[rule]]
id      = "audio.underrun"
level   = "info"
source  = "pipewire-pulse"
text    = "[{client}] underrun"
title   = "audio underruns ({client})"
note    = "possible audible gaps; not a stability problem"
explain = """
An application playing or recording audio through PipeWire did not keep up and the buffer
ran empty.
"""
match   = ["mod.protocol-pulse: 0x560c8778de50: [sunshine] underrun read:962252800 avail:0"]

[[rule]]
id      = "dbus.activation-failed"
level   = "info"
source  = "dbus-broker-launch"
text    = "Activation request for '{name}' failed"
title   = "D-Bus service {name} could not be started"
note    = "something asked for it; it is missing or disabled"
explain = """
A program asked D-Bus for a service that could not be started, because it isn't installed,
is disabled, or failed. It matters only if the program that needed it misbehaves.
"""
match   = ["Activation request for 'org.freedesktop.nm_dispatcher' failed."]

[[rule]]
id          = "dbus.service-file"
level       = "info"
source      = "dbus-broker-launch"
text        = [
  "Invalid user name",
  "Ignoring duplicate name",
  "is not named after the D-Bus name",
]
title       = "D-Bus service file problem"
note        = "packaging details; the services still work"
merge_title = "D-Bus service file problems"
explain     = """
A D-Bus service file installed by a package is malformed or conflicts with another one; D-Bus
ignores it or works around it.
"""
match       = ["Ignoring duplicate name 'org.freedesktop.Notifications' in service file '/usr/share/dbus-1/services/org.knopwob.dunst.service'"]

[[rule]]
id          = "network.nm-error"
level       = "warn"
source      = "NetworkManager"
priority    = "err"
text        = "<error>"
title       = "NetworkManager error"
merge_title = "NetworkManager errors"
explain     = """
NetworkManager reported an error; the message, under Lines, says which device and step.
"""
match       = ["<error> [1790349818.1852] device (wlp1s0): Couldn't initialize supplicant interface: Name owner lost"]

[[rule]]
id          = "bluetooth.error"
level       = "info"
source      = "bluetoothd"
priority    = "err"
title       = "bluetoothd error"
merge_title = "bluetoothd errors"
explain     = """
The Bluetooth daemon reported an internal error; the message, under Lines, names the part.
"""
match       = ["src/adv_monitor.c:btd_adv_monitor_power_down() Unexpected NULL btd_adv_monitor_manager object upon power down"]

[[rule]]
id          = "audio.no-rtkit"
level       = "info"
text        = [
  "mod.rt: RTKit error",
  "Failed to load RealtimeKit property",
]
title       = "RealtimeKit not available"
note        = "audio may crackle under load"
merge_title = "RealtimeKit not available"
explain     = """
PipeWire and the desktop portal asked RealtimeKit to run audio at real-time priority, and it
isn't there. Audio still works, but under load it can skip or crackle, with underruns in the
journal. RealtimeKit comes in the rtkit package.
"""
match       = [
  "mod.rt: RTKit error: org.freedesktop.DBus.Error.ServiceUnknown",
  "Failed to load RealtimeKit property: GDBus.Error:org.freedesktop.DBus.Error.ServiceUnknown: The name is not activatable",
]

[[rule]]
id      = "dbus.policy-denied"
level   = "info"
source  = "dbus-broker"
text    = [
  "A security policy denied {_} to send method call {call} to ",
  "A security policy denied {_} to send signal {call} to ",
]
title   = "D-Bus policy refused {call}"
note    = "matters only if the program behind it misbehaves"
explain = """
A program sent a D-Bus message that the bus policy doesn't allow, and the bus dropped it. The
policy comes with the packages and is usually right; it matters only if the program on the
other side misbehaves at the same time.
"""
match   = ["A security policy denied :1.4 to send method call /midi/profile:org.bluez.GattProfile1.Release to :1.48."]
nomatch = ["A security policy denied :1.4 to own the name org.example.Service."]
